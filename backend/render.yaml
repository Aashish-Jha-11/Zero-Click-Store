# Render Blueprint for the DukaanPilot backend.
# Render dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: dukaanpilot-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3001"
      # Set these as secrets in the Render dashboard — never commit them.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
